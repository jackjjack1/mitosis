name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS release
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag matches the app version
        run: node scripts/check-version.mjs --tag "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build and package the app
        env:
          MITOSIS_INSTALL_PATH: ${{ runner.temp }}/MITOSIS.app
        run: npm run desktop:build

      - name: Compile the WebKit smoke probe
        run: |
          swiftc -O -swift-version 5 \
            -framework Cocoa \
            -framework WebKit \
            scripts/desktop-smoke.swift \
            -o "$RUNNER_TEMP/mitosis-smoke"

      - name: Smoke-test the bundled interface
        run: |
          set -euo pipefail
          output=$("$RUNNER_TEMP/mitosis-smoke" \
            "$RUNNER_TEMP/MITOSIS.app/Contents/Resources/web/index.html")
          printf '%s\n' "$output"
          printf '%s' "$output" | python3 scripts/assert-smoke.py

      - name: Package the app for release
        run: |
          ditto -c -k --norsrc --noextattr --keepParent \
            "$RUNNER_TEMP/MITOSIS.app" \
            "$RUNNER_TEMP/MITOSIS-macos.zip"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          shasum -a 256 MITOSIS-macos.zip > MITOSIS-macos.zip.sha256
          cat MITOSIS-macos.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            macOS build is ad-hoc signed and not notarized. If macOS blocks it, right-click the app and choose Open, or run: xattr -dr com.apple.quarantine /Applications/MITOSIS.app

            Verify the download from the folder containing both files: shasum -a 256 -c MITOSIS-macos.zip.sha256
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP/MITOSIS-macos.zip#MITOSIS.app for macOS" \
            "$RUNNER_TEMP/MITOSIS-macos.zip.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "MITOSIS $TAG" \
            --notes "$RELEASE_NOTES" \
            --generate-notes
